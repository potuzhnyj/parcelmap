<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>parcelmap</title>
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header>
      <div class="container logoAndNav">
        <div class="brand">
          <img class="brandLogo" src="images/favicon.svg" alt="parcelmap logo" />
          <p class="brandName">
            <b>parcel</b><span>map</span>
          </p>
        </div>
        <nav>
          <ul>
            <li>
              <a href="index.html" class="activePage" data-i18n="home"></a>
            </li>
            <li><a href="about.html" data-i18n="about"></a></li>
            <li>
              <a href="https://github.com/potuzhnyj">GitHub</a>
            </li>
            <li>
              <select id="languageSelect">
                <option value="en">EN</option>
                <option value="cs">CZ</option>
              </select>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <div class="container information">
        <div class="parcelMapSide"><div id="map"></div></div>
        <div class="parcelInfoSide">
          <p class="panelBrand">
            <b>parcel</b><span>map</span>
          </p>

          <p class="panelDescription" data-i18n="description"></p>
          <hr />
          <div class="parcelInfo">
            <p class="selectedLabel" data-i18n="selectedParcel"></p>
            <div id="emptyState" class="emptyState">
              <div class="emptyIcon">⌖</div>
              <p data-i18n="selectParcelP1"></p>
              <span data-i18n="selectParcelP2"></span>
            </div>
            <div id="parcelDetails" class="hidden">
              <p class="bold" id="parcelNumber"></p>
              <div class="parcelSize">
                <p data-i18n="registeredArea"></p>
                <p class="bold" id="parcelArea"></p>
              </div>
              <p data-i18n="referenceNumber"></p>
              <p class="bold" id="cadastralReference"></p>
              <p data-i18n="dataSource"></p>
              <p class="bold">ČÚZK</p>
              <button id="importantButton" class="bold" data-i18n="button">
                Zoom to Parcel
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
    <div class="mobileWarning">
      <div class="rotateIcon">↻</div>
      <p data-i18n="mobileWarningP1"></p>
      <span data-i18n="mobileWarningP2"></span>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="scripts/app.js"></script>
    <script src="scripts/lang.js"></script>
  </body>
</html>
